name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs below are independent — none consumes another's artifacts; each checks out fresh and
# runs its own Gradle tasks. They therefore run in PARALLEL on separate runners instead of in a
# needs: chain. Do NOT re-add needs: unless a real artifact dependency is introduced.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        run: ./gradlew detekt

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests with coverage
        run: ./gradlew :app:test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          retention-days: 14

      - name: Upload Jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            app/build/reports/jacoco/jacocoTestReport/html/
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          retention-days: 14

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Job-level override of the workflow's contents:read default — this job alone needs to post
    # the debug-APK-link PR comment (marocchino/sticky-pull-request-comment, below).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags: build.gradle.kts derives versionName/versionCode from
          # git and fails configuration without them (no hardcoded fallback). On
          # pull_request runs this reflects the ephemeral merge ref, not the post-merge
          # main commit; these artifacts are unsigned and never shipped.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      # droidthumb-server's plan 03 milestone 1: every PR (either repo) should have a debug APK
      # readily reachable to test against that PR's staging deploy. The APK itself was already
      # built and uploaded above (has been since before this milestone) — this just makes it easy
      # to find from the PR itself instead of only from the Actions tab.
      - name: Comment debug APK link on the PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: debug-apk
          message: |
            Debug APK for this PR: see the **app-debug** artifact on [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
